name: Publish catalog site

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "styles.css"
      - "app.js"
      - "catalog/**"
      - "probe-report.json"
      - "scripts/refresh_status.py"
      - "scripts/build_subscriptions.py"
      - "scripts/check_catalog.py"
      - "schemas/**"
      - "tests/**"
      - "README.md"
      - "README.en.md"
      - ".github/workflows/catalog-check.yml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate catalog and assemble Pages artifact
        run: |
          python3 scripts/check_catalog.py
          python3 -m unittest discover -s tests
          mkdir -p _site
          cp index.html styles.css app.js _site/
          cp -R catalog _site/catalog
          if [ -f probe-report.json ]; then cp probe-report.json _site/; fi
          python3 scripts/build_subscriptions.py --output-dir _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
